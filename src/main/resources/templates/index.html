<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>She Can Foundation</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<nav class="navbar">

    <h2>She Can Foundation</h2>

    <button onclick="logout()">
        Logout
    </button>

</nav>
<section class="hero">

    <h1>
        Empowering Women
    </h1>

    <p>
        Together we can create opportunities,
        education, and support for women everywhere.
    </p>

</section>
<div id="toast"></div>
<div class="container">

    <h1>
        <i class="fa-solid fa-paper-plane"></i>
        Contact Us
    </h1>
    <p class="subtitle">
        We'd love to hear from you
    </p>

    <form id="contactForm">

        <input type="text"
               id="contactName"
               placeholder="Enter Name"
               required>
        <br>

        <input type="email"
               id="contactEmail"
               placeholder="Enter Email"
               required>
        <br>

        <textarea id="contactMessage"
                  placeholder="Enter Message"
                  rows="5"
                  required></textarea>

        <button type="submit">
            Submit
        </button>

    </form>

    <p id="contactResponse"></p>

</div>

<script src="/js/script.js"></script>

</body>
</html>
